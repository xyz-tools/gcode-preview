<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Arcs (G2/G3) — gcode-preview</title>
    <style>
      body { margin: 0; background: #eee; font: 14px/1.5 system-ui, sans-serif; }
      canvas { display: block; width: 100vw; height: 100vh; }
    </style>
  </head>
  <body>
    <!--
      Arcs (G2/G3): arc moves are tessellated into straight segments, and
      arcChordTolerance controls how fine that tessellation is.
    -->
    <canvas></canvas>
    <script type="importmap">
      {
        "imports": {
          "three": "../lib/three/build/three.module.min.js",
          "lil-gui": "../lib/lil-gui/dist/lil-gui.esm.min.js",
          "gcode-preview": "../dist/gcode-preview.es.js"
        }
      }
    </script>
    <script type="module">
      import { GCodePreview } from 'gcode-preview';

      const preview = new GCodePreview({
        canvas: document.querySelector('canvas'),
        extrusionColor: '#95dfa1',
        travelColor: 'red',
        extrusionWidth: 0.5,
        lineHeight: 0.3,
        buildVolume: { x: 130, y: 150, z: 0, smallGrid: true },
        // G2 (clockwise) and G3 (counter-clockwise) arcs are approximated by a
        // polyline. arcChordTolerance is the maximum deviation, in millimeters,
        // between those chords and the true arc — default 0.05. Lower values
        // give smoother arcs but more geometry (more vertices, slower render);
        // higher values are cheaper but visibly faceted. A single segment never
        // spans more than 22.5°, so even tiny circles get at least 16 segments.
        // Both parameter forms are supported: I/J as the offset from the start
        // point to the arc centre, and R as a radius (R wins when non-zero, and
        // cannot describe a full circle). Z on the same command makes it helical.
        arcChordTolerance: 0.02
      });

      const response = await fetch('../gcodes/screw.gcode');
      await preview.processGCode(await response.text());
    </script>
  </body>
</html>
