<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Orthographic camera — gcode-preview</title>
    <style>
      body { margin: 0; background: #eee; font: 14px/1.5 system-ui, sans-serif; }
      canvas { display: block; width: 100vw; height: 100vh; }
    </style>
  </head>
  <body>
    <!--
      Orthographic camera: `orthographic: true` swaps the default perspective
      camera for a parallel-projection one, so parallel lines stay parallel —
      a technical/CAD-like top or front view. Combined with
      `initialCameraPosition` for a straight top-down look at plant-sign.gcode
      (the demo's `travel-moves` preset), where the travel moves are obvious.
    -->
    <canvas></canvas>
    <script type="importmap">
      {
        "imports": {
          "three": "../lib/three/build/three.module.min.js",
          "lil-gui": "../lib/lil-gui/dist/lil-gui.esm.min.js",
          "gcode-preview": "../dist/gcode-preview.es.js"
        }
      }
    </script>
    <script type="module">
      import { GCodePreview } from 'gcode-preview';

      const preview = new GCodePreview({
        canvas: document.querySelector('canvas'),
        // Parallel projection: no perspective distortion, no field of view. The
        // frustum is derived automatically — its height is the largest dimension
        // of the loaded job's bounding box (or of the build volume while nothing
        // is loaded yet) plus a 20% margin, recomputed on every resize. So there
        // is no `zoom` or `frustumSize` option to set; pan/zoom with the mouse,
        // or set `preview.sceneManager.camera.zoom` yourself.
        orthographic: true,
        // World coordinates [x, y, z] in mm, three.js axes: Y is up, and the
        // plate lies in X/-Z, so the print sits in x 0..buildVolume.x and
        // z 0..-buildVolume.y. The orbit target is the plate center
        // (buildVolume.x / 2, 0, -buildVolume.y / 2) = (100, 0, -100), so this
        // is straight above it: a top view. Distance doesn't change the size of
        // an orthographic image, only what stays inside near/far (0.1..10000).
        initialCameraPosition: [100, 400, -100],
        renderExtrusion: true,
        renderTubes: true,
        lineWidth: 1,
        lineHeight: 0.3,
        extrusionColor: '#919191',
        topLayerColor: '#aaaaaa',
        // travel moves are always drawn as flat lines, in `travelColor`
        renderTravel: true,
        travelColor: '#00ff00',
        buildVolume: { x: 200, y: 200, z: 0 }
      });

      const response = await fetch('../gcodes/plant-sign.gcode');
      await preview.processGCode(await response.text());
      // the frustum was sized from the build volume before the job existed;
      // resize() re-derives it from the model's bounding box
      preview.sceneManager.resize();

      // The projection CAN be switched at runtime — it is not construction-only.
      // Assigning the property rebuilds the camera and the orbit controls while
      // keeping the current position and target. Try it in the console:
      //   preview.sceneManager.orthographic = false;
      window.preview = preview;
    </script>
  </body>
</html>
