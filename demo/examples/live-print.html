<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Live print — gcode-preview</title>
    <link rel="stylesheet" href="runner.css" />
  </head>
  <body>
    <header>
      <a href="index.html">← all examples</a>
      <h1>Live print</h1>
      <p>Replay a file the way a printer would run it: moves arriving over time, not a file loaded all at once.</p>
    </header>

    <main>
      <section class="code">
        <div class="toolbar">
          <button id="run" class="primary">Run</button>
          <button id="reset">Reset</button>
          <kbd>⌘/Ctrl + ↵</kbd>
          <span id="status"></span>
        </div>
        <textarea spellcheck="false" aria-label="Example code"></textarea>
        <details>
          <summary>The rest of the page</summary>
          <pre id="setup"></pre>
        </details>
      </section>
      <iframe title="Example output"></iframe>
    </main>

    <script type="importmap">
      {
        "imports": {
          "three": "../lib/three/build/three.module.min.js",
          "gcode-preview": "../dist/gcode-preview.es.js"
        }
      }
    </script>

    <template id="output">
      <style>
        canvas { display: block; width: 100vw; height: 100vh; }
        #hud {
          position: fixed; left: 0; right: 0; bottom: 0;
          display: flex; gap: 12px; align-items: center;
          padding: 10px 16px; background: rgba(0, 0, 0, 0.6); color: #fff;
          font: 13px/1.4 system-ui, sans-serif;
        }
        #hud progress { flex: 1; }
        #hud output { min-width: 10em; text-align: right; font-variant-numeric: tabular-nums; }
      </style>
      <canvas></canvas>
      <div id="hud">
        <button id="pause">Pause</button>
        <progress id="progress" max="1" value="0"></progress>
        <output id="readout">starting…</output>
      </div>
    </template>

    <script type="text/plain" id="code">
      import { GCodePreview } from 'gcode-preview';

      const canvas = document.querySelector('canvas');
      const progress = document.querySelector('#progress');
      const readout = document.querySelector('#readout');

      const preview = new GCodePreview({
        canvas,
        buildVolume: { x: 180, y: 180, z: 0 },
        extrusionWidth: 0.45,
        lineHeight: 0.2,
        extrusionColor: '#95dfa1',
        backgroundColor: '#141414',
        // Draw on every chunk: a chunk here is one batch of moves the printer
        // just ran, and there are few enough of them for that to be cheap.
        liveRenderInterval: 0
      });

      const moves = await fetch('../gcodes/3DBenchy.gcode')
        .then((response) => response.text())
        .then((text) => text.split('\n'));

      let sent = 0;
      let paused = false;

      // A printer hands you the moves it has executed, not a file. So instead of a
      // fetch body, give processGCodeStream a stream you fill in over time — the
      // parsing, layer counting and progressive redraw downstream are identical.
      const printer = new ReadableStream({
        async pull(controller) {
          while (paused) await new Promise((resolve) => setTimeout(resolve, 100));
          await new Promise((resolve) => setTimeout(resolve, 40));

          if (sent >= moves.length) return controller.close();
          controller.enqueue(moves.slice(sent, sent + 500).join('\n') + '\n');
          sent = Math.min(sent + 500, moves.length);

          progress.value = sent / moves.length;
          readout.textContent = `layer ${preview.job.countLayers} · ${Math.round(progress.value * 100)}%`;
        }
      });

      document.querySelector('#pause').addEventListener('click', (event) => {
        paused = !paused;
        event.target.textContent = paused ? 'Resume' : 'Pause';
      });

      // The renderer is sized once, at construction. Nothing in the library
      // watches the canvas, so tell it when the canvas changes size.
      new ResizeObserver(() => preview.sceneManager.resize()).observe(canvas);

      // Keep the viewpoint across a reload — and so across Run, which loads
      // the page again. saveCamera()/loadCamera() persist position, rotation,
      // zoom and orbit target to localStorage.
      preview.sceneManager.loadCamera();
      preview.sceneManager.controls.addEventListener('end', () => preview.sceneManager.saveCamera());

      await preview.processGCodeStream(printer);
      readout.textContent = `done · ${preview.job.countLayers} layers`;
    </script>

    <script type="module" src="runner.js"></script>
  </body>
</html>
