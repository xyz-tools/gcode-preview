<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Build volume — gcode-preview</title>
    <style>
      body { margin: 0; background: #eee; font: 14px/1.5 system-ui, sans-serif; }
      canvas { display: block; width: 100vw; height: 100vh; }
    </style>
  </head>
  <body>
    <!--
      Build volume: the printer bed grid and volume outline, sized with the
      `buildVolume` option (the calicat preset's 180 x 180 bed).
    -->
    <canvas></canvas>
    <script type="importmap">
      {
        "imports": {
          "three": "../lib/three/build/three.module.min.js",
          "lil-gui": "../lib/lil-gui/dist/lil-gui.esm.min.js",
          "gcode-preview": "../dist/gcode-preview.es.js"
        }
      }
    </script>
    <script type="module">
      import { GCodePreview } from 'gcode-preview';

      const preview = new GCodePreview({
        canvas: document.querySelector('canvas'),
        extrusionColor: 'pink',
        // Every field of the build volume definition:
        buildVolume: {
          x: 180, // bed width in mm (required, clamped to >= 0; 0 draws nothing)
          y: 180, // bed depth in mm (required, clamped to >= 0; 0 draws nothing)
          // Height in mm. 0 collapses the wireframe outline onto the bed, so
          // you see just the flat plate; a real height (e.g. 180) draws the
          // full box around the print.
          z: 0,
          // Optional finer 1mm grid on top of the 10mm one. Defaults to false.
          smallGrid: false
        }
      });

      const response = await fetch('../gcodes/calicat.gcode');
      await preview.processGCode(await response.text());
    </script>
  </body>
</html>
