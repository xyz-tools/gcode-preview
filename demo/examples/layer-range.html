<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Layer range — gcode-preview</title>
    <link rel="stylesheet" href="runner.css" />
  </head>
  <body>
    <header>
      <a href="index.html">← all examples</a>
      <h1>Layer range</h1>
      <p>Scrub the visible layers with a slider, the way a slicer's layer view does.</p>
    </header>

    <main>
      <section class="code">
        <div class="toolbar">
          <button id="run" class="primary">Run</button>
          <button id="reset">Reset</button>
          <kbd>⌘/Ctrl + ↵</kbd>
          <span id="status"></span>
        </div>
        <textarea spellcheck="false" aria-label="Example code"></textarea>
        <details>
          <summary>The rest of the page</summary>
          <pre id="setup"></pre>
        </details>
      </section>
      <iframe title="Example output"></iframe>
    </main>

    <script type="importmap">
      {
        "imports": {
          "three": "../lib/three/build/three.module.min.js",
          "gcode-preview": "../dist/gcode-preview.es.js"
        }
      }
    </script>

    <template id="output">
      <style>
        canvas { display: block; width: 100vw; height: 100vh; }
        .controls {
          position: fixed; left: 0; right: 0; bottom: 0;
          display: flex; gap: 12px; align-items: center;
          padding: 10px 16px; background: rgba(255, 255, 255, 0.85);
        }
        .controls input { flex: 1; }
        .controls output { min-width: 8em; text-align: right; font-variant-numeric: tabular-nums; }
      </style>
      <canvas></canvas>
      <div class="controls">
        <label for="top">Top layer</label>
        <input id="top" type="range" min="1" max="1" value="1" disabled />
        <output id="readout">…</output>
      </div>
    </template>

    <script type="text/plain" id="code">
      import { GCodePreview } from 'gcode-preview';

      const canvas = document.querySelector('canvas');
      const slider = document.querySelector('#top');
      const readout = document.querySelector('#readout');

      const preview = new GCodePreview({
        canvas,
        extrusionColor: '#95dfa1',
        travelColor: 'red',
        extrusionWidth: 0.45,
        lineHeight: 0.2,
        buildVolume: { x: 180, y: 180, z: 0 },
        // The highlight follows the top of the *visible* range: topLayerColor
        // recolors the whole layer at endLayer, lastSegmentColor just that layer's
        // final segment. So both move with the slider.
        topLayerColor: 'white',
        lastSegmentColor: '#000'
      });

      const gcode = await fetch('../gcodes/3DBenchy.gcode').then((response) => response.text());
      await preview.processGCode(gcode);

      // countLayers is only known once the G-code has been processed.
      const total = preview.countLayers;
      slider.max = total;
      slider.value = total;
      slider.disabled = false;
      slider.addEventListener('input', update);
      update();

      function update() {
        const top = Number(slider.value);
        // 1-based, inclusive. Set both to the same value (or use
        // sceneManager.singleLayerMode) to show a single layer.
        preview.sceneManager.startLayer = 1;
        preview.sceneManager.endLayer = top;
        // No manual redraw needed: the setters re-render when the highlight has to
        // move, and the scene manager paints every frame.
        readout.textContent = `layer ${top} / ${total}`;
      }

      // The renderer is sized once, at construction. Nothing in the library
      // watches the canvas, so tell it when the canvas changes size.
      new ResizeObserver(() => preview.sceneManager.resize()).observe(canvas);

      // Keep the viewpoint across a reload — and so across Run, which loads
      // the page again. saveCamera()/loadCamera() persist position, rotation,
      // zoom and orbit target to localStorage.
      preview.sceneManager.loadCamera();
      preview.sceneManager.controls.addEventListener('end', () => preview.sceneManager.saveCamera());
    </script>

    <script type="module" src="runner.js"></script>
  </body>
</html>
