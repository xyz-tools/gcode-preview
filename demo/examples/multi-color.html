<!doctype html>
<!--
  Multi-color / multi-tool: `extrusionColor` accepts an array of colors, one per
  tool, so a dual-material print renders in the colors it was actually printed in.
  Model: "2-color tree frog" by nervoussystem, CC BY-NC (thingiverse.com/thing:329436).
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Multi-color — gcode-preview</title>
    <style>
      body { margin: 0; background: #eee; font: 14px/1.5 system-ui, sans-serif; }
      canvas { display: block; width: 100vw; height: 100vh; }
    </style>
  </head>
  <body>
    <canvas></canvas>
    <script type="importmap">
      {
        "imports": {
          "three": "../lib/three/build/three.module.min.js",
          "lil-gui": "../lib/lil-gui/dist/lil-gui.esm.min.js",
          "gcode-preview": "../dist/gcode-preview.es.js"
        }
      }
    </script>
    <script type="module">
      import { GCodePreview } from 'gcode-preview';

      const preview = new GCodePreview({
        canvas: document.querySelector('canvas'),
        buildVolume: { x: 250, y: 250, z: 0 },
        extrusionWidth: 0.45,
        lineHeight: 0.2,
        // One color per tool, indexed by the tool number from the T commands:
        // T0 extrusions are drawn green, T1 extrusions orange. A file that uses
        // more tools than there are colors reuses the array's last color (and
        // warns once per missing tool index) rather than failing.
        extrusionColor: ['#4a9c3f', '#e0a030']
      });

      // The file lives on a remote bucket, so stream it: paths are parsed and
      // drawn as chunks arrive, instead of buffering the whole file first.
      const response = await fetch(
        'https://storage.googleapis.com/gcode-preview.firebasestorage.app/2color_treefrog.gcode'
      );
      await preview.processGCodeStream(response.body.pipeThrough(new TextDecoderStream()));
    </script>
  </body>
</html>
