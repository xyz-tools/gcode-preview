<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Tube geometry — gcode-preview</title>
    <style>
      body { margin: 0; background: #eee; font: 14px/1.5 system-ui, sans-serif; }
      canvas { display: block; width: 100vw; height: 100vh; }
    </style>
  </head>
  <body>
    <!--
      Tube geometry: `renderTubes: true` draws every extrusion as a solid 3D tube
      with real width and height instead of a flat line (vase.gcode, a vase-mode
      spiral, using the demo's `vase-mode` preset settings).
    -->
    <canvas></canvas>
    <script type="importmap">
      {
        "imports": {
          "three": "../lib/three/build/three.module.min.js",
          "lil-gui": "../lib/lil-gui/dist/lil-gui.esm.min.js",
          "gcode-preview": "../dist/gcode-preview.es.js"
        }
      }
    </script>
    <script type="module">
      import { GCodePreview } from 'gcode-preview';

      const preview = new GCodePreview({
        canvas: document.querySelector('canvas'),
        renderExtrusion: true,
        // Draw extrusions as tubes. Tube cross-section = extrusion width x line
        // height, resolved per path in this order:
        //   1. the slicer's own `;WIDTH:` / `;HEIGHT:` comments (always win)
        //   2. the `extrusionWidth` / `lineHeight` options below (fallback)
        //   3. the built-in defaults: 0.6 mm wide, 0.2 mm high
        // vase.gcode does carry `;WIDTH:` / `;HEIGHT:` comments, so its paths use
        // those and `lineHeight` only fills in for any path without them.
        renderTubes: true,
        lineHeight: 0.4,
        // `lineWidth` is the screen-space width of *flat* lines: it styles travel
        // moves here, and extrusions only when renderTubes is off.
        lineWidth: 0.5,
        extrusionColor: '#8782bf',
        renderTravel: true,
        travelColor: '#00ff00',
        // vase mode is one continuous spiral, so ignore Z changes below 0.6 mm
        // when splitting the job into layers
        minLayerThreshold: 0.6,
        buildVolume: { x: 200, y: 200, z: 0 },
        initialCameraPosition: [-404, 320, 184]
      });

      const response = await fetch('../gcodes/vase.gcode');
      await preview.processGCode(await response.text());

      // Flip it at runtime: assigning the property is enough — the geometry is
      // rebuilt and redrawn automatically (coalesced over ~100ms), no explicit
      // re-render needed. Try it in the console:
      //   preview.sceneManager.renderTubes = false;
      window.preview = preview;
    </script>
  </body>
</html>
