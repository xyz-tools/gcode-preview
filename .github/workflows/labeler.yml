name: Label PRs by changed paths

on:
  # pull_request_target so PRs from forks can be labeled too. Safe because the
  # labeler only reads the changed file list and never checks out PR code.
  # Note: this runs the workflow as it exists on the base branch.
  pull_request_target:
    branches:
      - develop
      - v3.x
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/labeler@v7
