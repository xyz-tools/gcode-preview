# This file was auto-generated by the Firebase CLI
# https://github.com/firebase/firebase-tools

name: Deploy to Firebase Hosting on PR

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - develop
      - v3.x
  workflow_dispatch:

permissions:
  checks: write
  contents: write
  pull-requests: write

jobs:
  build_and_preview:
    if: >-
      github.event.action != 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      # A preview is only worth building when the deployed output can actually
      # differ: the library, the demo it loads, or the deploy/docs config.
      # Doc- and test-only PRs skip the whole build and deploy.
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            deployable:
              - 'src/**'
              - '!src/__tests__/**'
              - 'demo/**'
              - 'package.json'
              - 'package-lock.json'
              - 'rollup.config.mjs'
              - 'firebase.json'
              - 'typedoc.json'
              - 'typedoc.css'
              - '.github/workflows/firebase-hosting-pull-request.yml'
      - if: steps.filter.outputs.deployable == 'true'
        run: npm ci && npm run predeploy && npm run typedoc
      - if: steps.filter.outputs.deployable == 'true'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          expires: 30d
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_GCODE_PREVIEW }}'
          projectId: gcode-preview

  cleanup_preview:
    if: >-
      github.event.action == 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository

    runs-on: ubuntu-latest

    steps:
      # The deploy action has no teardown of its own
      # (FirebaseExtended/action-hosting-deploy#60), so the channel is removed
      # with the CLI. The action names its channel `pr<number>-<branch>` with
      # the branch sanitized and truncated, so we match on the `pr<number>-`
      # prefix rather than reproducing that truncation here.
      - name: Delete the PR's preview channel
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_GCODE_PREVIEW }}
        run: |
          set -euo pipefail
          echo "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/service-account.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/service-account.json"
          firebase() { npx --yes firebase-tools@14 "$@" --project gcode-preview; }
          channel=$(firebase hosting:channel:list --json |
            jq -r --arg prefix "pr${PR_NUMBER}-" \
              '.result.channels[].name | split("/") | last | select(startswith($prefix))')
          if [ -z "$channel" ]; then
            echo "No preview channel for PR ${PR_NUMBER}; nothing to delete."
            exit 0
          fi
          echo "Deleting preview channel $channel"
          firebase hosting:channel:delete "$channel" --force
